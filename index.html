<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<title>ペース・プレーヤー</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#14171C;
    --surface:#1E232B;
    --surface-2:#262C35;
    --accent:#FF8A3D;
    --accent-ink:#1A1206;
    --accent-2:#6EE7C9;
    --text:#F2EFEA;
    --text-muted:#8B9099;
    --radius:18px;
    --font-mono: ui-monospace, "SF Mono", "Roboto Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  body{
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
  }
  button{ font-family:inherit; cursor:pointer; touch-action:manipulation; }
  input[type=range]{ touch-action:manipulation; }

  .app{ max-width:480px; margin:0 auto; padding:0 16px 32px; }

  /* ---- top bar ---- */
  .topbar{
    padding:18px 4px 10px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar-title{
    font-size:15px; color:var(--text-muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ---- speed hero ---- */
  .speed-hero{
    background:var(--surface);
    border-radius:24px;
    padding:22px 16px 20px;
    margin-bottom:14px;
    text-align:center;
  }
  .speed-label{
    font-size:13px; letter-spacing:.08em; color:var(--text-muted);
    text-transform:uppercase; margin-bottom:4px;
  }
  .speed-row{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin:6px 0 14px;
  }
  .speed-btn{
    width:clamp(56px,16vw,72px); height:clamp(56px,16vw,72px);
    border-radius:50%; border:none;
    background:var(--surface-2); color:var(--text);
    font-size:30px; font-weight:600; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition: transform .08s ease, background .15s ease;
  }
  .speed-btn:active{ transform:scale(.92); background:#30384a; }
  .speed-display{
    font-family:var(--font-mono);
    font-size:clamp(60px,20vw,104px);
    font-weight:700; line-height:1;
    min-width:clamp(150px,42vw,260px);
    font-variant-numeric: tabular-nums;
    color:var(--accent);
  }
  .speed-unit{ font-size:.4em; color:var(--text-muted); margin-left:2px; font-weight:600; }
  .speed-slider{
    width:100%; height:44px; margin:4px 0 12px;
    -webkit-appearance:none; appearance:none;
    background:transparent;
  }
  .speed-slider::-webkit-slider-runnable-track{
    height:10px; border-radius:6px; background:var(--surface-2);
  }
  .speed-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:32px; height:32px; margin-top:-11px;
    border-radius:50%; background:var(--accent); border:4px solid var(--bg);
  }
  .speed-slider::-moz-range-track{ height:10px; border-radius:6px; background:var(--surface-2); }
  .speed-slider::-moz-range-thumb{
    width:32px; height:32px; border-radius:50%; background:var(--accent); border:4px solid var(--bg);
  }
  .speed-presets{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px;
  }
  .preset-btn{
    border:none; border-radius:999px; padding:9px 14px;
    background:var(--surface-2); color:var(--text); font-size:14px; font-weight:600;
    font-family:var(--font-mono);
  }
  .preset-btn.active{ background:var(--accent); color:var(--accent-ink); }
  .reset-btn{
    border:none; background:none; color:var(--text-muted);
    font-size:13px; text-decoration:underline; padding:6px;
  }

  /* ---- transport ---- */
  .transport{
    display:flex; align-items:center; justify-content:center; gap:12px;
    margin:18px 0 16px;
  }
  .transport-btn{
    width:60px; height:60px; border-radius:50%; border:none;
    background:var(--surface); color:var(--text); font-size:24px;
    display:flex; align-items:center; justify-content:center;
    transition: transform .08s ease;
  }
  .transport-btn:active{ transform:scale(.9); }
  .play-btn{
    width:88px; height:88px; border-radius:50%; border:none;
    background:var(--accent); color:var(--accent-ink); font-size:34px;
    display:flex; align-items:center; justify-content:center;
    transition: transform .08s ease;
  }
  .play-btn:active{ transform:scale(.93); }
  .skip-btn{
    width:52px; height:52px; border-radius:50%; border:none;
    background:var(--surface); color:var(--text);
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    line-height:1.1; transition: transform .08s ease;
  }
  .skip-btn span{ font-size:18px; line-height:1; }
  .skip-btn:active{ transform:scale(.9); }

  /* ---- seek ---- */
  .seek{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-mono); font-size:13px; color:var(--text-muted);
    margin-bottom:10px;
  }
  .seek-slider{ flex:1; height:36px; -webkit-appearance:none; appearance:none; background:transparent; }
  .seek-slider::-webkit-slider-runnable-track{ height:6px; border-radius:4px; background:var(--surface-2); }
  .seek-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; margin-top:-7px;
    border-radius:50%; background:var(--accent-2); border:3px solid var(--bg);
  }
  .seek-slider::-moz-range-track{ height:6px; border-radius:4px; background:var(--surface-2); }
  .seek-slider::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:var(--accent-2); border:3px solid var(--bg); }

  /* ---- volume ---- */
  .volume{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .volume-icon{ font-size:16px; color:var(--text-muted); }
  .volume-slider{ flex:1; height:32px; -webkit-appearance:none; appearance:none; background:transparent; }
  .volume-slider::-webkit-slider-runnable-track{ height:6px; border-radius:4px; background:var(--surface-2); }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; margin-top:-6px;
    border-radius:50%; background:var(--text-muted); border:3px solid var(--bg);
  }
  .volume-slider::-moz-range-track{ height:6px; border-radius:4px; background:var(--surface-2); }
  .volume-slider::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; background:var(--text-muted); border:3px solid var(--bg); }

  /* ---- playlist ---- */
  .playlist-section{ background:var(--surface); border-radius:20px; padding:16px; }
  .playlist-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .playlist-header h2{ font-size:15px; margin:0; color:var(--text-muted); font-weight:600; }
  .add-files-btn{
    background:var(--surface-2); color:var(--text); font-size:13px; font-weight:600;
    padding:9px 14px; border-radius:999px; cursor:pointer;
  }
  .repeat-row{ margin-bottom:8px; }
  .repeat-btn{
    border:none; background:var(--surface-2); color:var(--text-muted);
    font-size:13px; padding:8px 12px; border-radius:999px;
  }
  .repeat-btn[aria-pressed="true"]{ background:var(--accent-2); color:#0E2E27; }
  .playlist{ list-style:none; margin:0; padding:0; max-height:280px; overflow-y:auto; }
  .playlist-item{
    padding:13px 10px; border-radius:12px; font-size:14px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .playlist-item:active{ background:var(--surface-2); }
  .playlist-item.active{ background:var(--surface-2); color:var(--accent); font-weight:600; }
  .empty-msg{ color:var(--text-muted); font-size:13px; line-height:1.6; margin:6px 2px; }
  .hint{ color:var(--text-muted); font-size:12px; line-height:1.6; text-align:center; margin:18px 4px 0; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-title" id="trackTitle">トラック未選択</div>
  </header>

  <main>
    <section class="speed-hero" aria-label="再生速度">
      <div class="speed-label">速度</div>
      <div class="speed-row">
        <button class="speed-btn" id="speedDown" aria-label="速度を1%下げる">−</button>
        <div class="speed-display"><span id="speedNumber">100</span><span class="speed-unit">%</span></div>
        <button class="speed-btn" id="speedUp" aria-label="速度を1%上げる">＋</button>
      </div>
      <input type="range" id="speedSlider" min="50" max="150" step="1" value="100" class="speed-slider" aria-label="速度スライダー">
      <div class="speed-presets" id="speedPresets"></div>
      <button class="reset-btn" id="speedReset">100%にリセット</button>
    </section>

    <section class="transport" aria-label="再生コントロール">
      <button class="transport-btn" id="prevBtn" aria-label="前のトラック">⏮</button>
      <button class="skip-btn" id="seekBackBtn" aria-label="5秒戻る"><span>⟲</span>5s</button>
      <button class="play-btn" id="playBtn" aria-label="再生">▶</button>
      <button class="skip-btn" id="seekForwardBtn" aria-label="10秒進む"><span>⟳</span>5s</button>
      <button class="transport-btn" id="nextBtn" aria-label="次のトラック">⏭</button>
    </section>

    <section class="seek" aria-label="シークバー">
      <span id="currentTime">0:00</span>
      <input type="range" id="seekSlider" min="0" max="0" step="1" value="0" class="seek-slider" aria-label="再生位置">
      <span id="durationTime">0:00</span>
    </section>

    <section class="volume" aria-label="音量">
      <span class="volume-icon">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="100" step="1" value="100" class="volume-slider" aria-label="音量">
    </section>

    <section class="playlist-section" aria-label="プレイリスト">
      <div class="playlist-header">
        <h2>プレイリスト</h2>
        <label class="add-files-btn">
          ファイルを追加
          <input type="file" id="fileInput" accept="audio/*" multiple hidden>
        </label>
      </div>
      <div class="repeat-row">
        <button id="repeatBtn" class="repeat-btn" aria-pressed="false">🔁 リピート: オフ</button>
      </div>
      <ul id="playlist" class="playlist"></ul>
      <p class="empty-msg" id="emptyMsg">音声ファイルがまだ選択されていません。「ファイルを追加」から選んでください。</p>
    </section>

    <p class="hint">画面をロックしても再生は続きます。ブラウザのタブを完全に閉じない限り再生が継続します。</p>
  </main>

  <audio id="audio" preload="auto"></audio>
</div>

<script>
(function(){
  const audio = document.getElementById('audio');
  const trackTitleEl = document.getElementById('trackTitle');

  const speedNumber = document.getElementById('speedNumber');
  const speedSlider = document.getElementById('speedSlider');
  const speedDown = document.getElementById('speedDown');
  const speedUp = document.getElementById('speedUp');
  const speedReset = document.getElementById('speedReset');
  const speedPresets = document.getElementById('speedPresets');

  const prevBtn = document.getElementById('prevBtn');
  const playBtn = document.getElementById('playBtn');
  const nextBtn = document.getElementById('nextBtn');
  const seekBackBtn = document.getElementById('seekBackBtn');
  const seekForwardBtn = document.getElementById('seekForwardBtn');

  const seekSlider = document.getElementById('seekSlider');
  const currentTimeEl = document.getElementById('currentTime');
  const durationTimeEl = document.getElementById('durationTime');

  const volumeSlider = document.getElementById('volumeSlider');

  const fileInput = document.getElementById('fileInput');
  const playlistEl = document.getElementById('playlist');
  const emptyMsg = document.getElementById('emptyMsg');
  const repeatBtn = document.getElementById('repeatBtn');

  let playlist = [];      // { name, url }
  let currentIndex = -1;
  let isSeeking = false;
  let repeatAll = false;

  // ピッチを変えずに速度だけ変える(対応ブラウザではデフォルトでtrueだが明示しておく)
  audio.preservesPitch = true;
  audio.mozPreservesPitch = true;
  audio.webkitPreservesPitch = true;

  function formatTime(sec){
    if(!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    return m + ':' + s;
  }

  function currentSpeedValue(){
    return Number(speedSlider.value);
  }

  function applySpeed(value){
    value = Math.min(150, Math.max(50, Math.round(Number(value))));
    audio.playbackRate = value / 100;
    audio.preservesPitch = true;
    audio.mozPreservesPitch = true;
    audio.webkitPreservesPitch = true;
    speedNumber.textContent = value;
    speedSlider.value = value;
    speedPresets.querySelectorAll('.preset-btn').forEach(function(btn){
      btn.classList.toggle('active', Number(btn.dataset.speed) === value);
    });
  }

  // プリセットチップ生成
  [60, 80, 100, 120, 140].forEach(function(v){
    const btn = document.createElement('button');
    btn.className = 'preset-btn' + (v === 100 ? ' active' : '');
    btn.dataset.speed = v;
    btn.textContent = v + '%';
    btn.addEventListener('click', function(){ applySpeed(v); });
    speedPresets.appendChild(btn);
  });

  speedDown.addEventListener('click', function(){ applySpeed(currentSpeedValue() - 1); });
  speedUp.addEventListener('click', function(){ applySpeed(currentSpeedValue() + 1); });
  speedSlider.addEventListener('input', function(){ applySpeed(speedSlider.value); });
  speedReset.addEventListener('click', function(){ applySpeed(100); });

  function loadTrack(index, autoplay){
    if(index < 0 || index >= playlist.length) return;
    currentIndex = index;
    const track = playlist[index];
    audio.src = track.url;
    audio.playbackRate = currentSpeedValue() / 100;
    audio.preservesPitch = true;
    audio.mozPreservesPitch = true;
    audio.webkitPreservesPitch = true;
    audio.volume = Number(volumeSlider.value) / 100;
    trackTitleEl.textContent = track.name;
    renderPlaylist();
    updateMediaSessionMetadata(track.name);
    if(autoplay){
      audio.play().catch(function(){ /* ユーザー操作待ち */ });
    }
  }

  function togglePlay(){
    if(playlist.length === 0) return;
    if(currentIndex === -1){
      loadTrack(0, true);
      return;
    }
    if(audio.paused){
      audio.play().catch(function(){});
    } else {
      audio.pause();
    }
  }

  playBtn.addEventListener('click', togglePlay);

  audio.addEventListener('play', function(){
    playBtn.textContent = '⏸';
    playBtn.setAttribute('aria-label', '一時停止');
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  });
  audio.addEventListener('pause', function(){
    playBtn.textContent = '▶';
    playBtn.setAttribute('aria-label', '再生');
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  });

  prevBtn.addEventListener('click', function(){
    if(playlist.length === 0) return;
    let idx = currentIndex - 1;
    if(idx < 0) idx = repeatAll ? playlist.length - 1 : 0;
    loadTrack(idx, true);
  });

  nextBtn.addEventListener('click', function(){
    if(playlist.length === 0) return;
    let idx = currentIndex + 1;
    if(idx >= playlist.length){
      if(!repeatAll) return;
      idx = 0;
    }
    loadTrack(idx, true);
  });

  audio.addEventListener('ended', function(){
    let idx = currentIndex + 1;
    if(idx >= playlist.length){
      if(repeatAll){ loadTrack(0, true); }
      return;
    }
    loadTrack(idx, true);
  });

  seekBackBtn.addEventListener('click', function(){
    if(currentIndex === -1) return;
    audio.currentTime = Math.max(0, audio.currentTime - 5);
  });
  seekForwardBtn.addEventListener('click', function(){
    if(currentIndex === -1) return;
    const max = isFinite(audio.duration) ? audio.duration : audio.currentTime + 10;
    audio.currentTime = Math.min(max, audio.currentTime + 10);
  });

  audio.addEventListener('loadedmetadata', function(){
    durationTimeEl.textContent = formatTime(audio.duration);
    seekSlider.max = Math.floor(audio.duration) || 0;
  });

  audio.addEventListener('timeupdate', function(){
    if(isSeeking) return;
    seekSlider.value = Math.floor(audio.currentTime);
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  seekSlider.addEventListener('input', function(){
    isSeeking = true;
    currentTimeEl.textContent = formatTime(Number(seekSlider.value));
  });
  seekSlider.addEventListener('change', function(){
    audio.currentTime = Number(seekSlider.value);
    isSeeking = false;
  });

  volumeSlider.addEventListener('input', function(){
    audio.volume = Number(volumeSlider.value) / 100;
  });

  repeatBtn.addEventListener('click', function(){
    repeatAll = !repeatAll;
    repeatBtn.textContent = repeatAll ? '🔁 リピート: オン' : '🔁 リピート: オフ';
    repeatBtn.setAttribute('aria-pressed', String(repeatAll));
  });

  function renderPlaylist(){
    playlistEl.innerHTML = '';
    playlist.forEach(function(track, i){
      const li = document.createElement('li');
      li.className = 'playlist-item' + (i === currentIndex ? ' active' : '');
      li.textContent = (i + 1) + '. ' + track.name;
      li.addEventListener('click', function(){ loadTrack(i, true); });
      playlistEl.appendChild(li);
    });
  }

  fileInput.addEventListener('change', function(e){
    const files = Array.from(e.target.files || []);
    files.forEach(function(file){
      playlist.push({
        name: file.name.replace(/\.[^.]+$/, ''),
        url: URL.createObjectURL(file)
      });
    });
    emptyMsg.style.display = playlist.length ? 'none' : 'block';
    renderPlaylist();
    if(currentIndex === -1 && playlist.length > 0){
      loadTrack(0, false);
    }
    fileInput.value = '';
  });

  // ロック画面・通知からの最低限の操作にも対応(対応ブラウザのみ・任意)
  function updateMediaSessionMetadata(title){
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title,
        artist: 'ペース・プレーヤー'
      });
    }
  }
  if('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', function(){ audio.play().catch(function(){}); });
    navigator.mediaSession.setActionHandler('pause', function(){ audio.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', function(){ prevBtn.click(); });
    navigator.mediaSession.setActionHandler('nexttrack', function(){ nextBtn.click(); });
    try{
      navigator.mediaSession.setActionHandler('seekto', function(details){
        if(details.fastSeek && 'fastSeek' in audio){ audio.fastSeek(details.seekTime); return; }
        audio.currentTime = details.seekTime;
      });
    }catch(e){ /* 未対応ブラウザは無視 */ }
  }

  // 画面オフ・タブのバックグラウンド化で再生を止めない
  // (visibilitychange 等で pause() を呼ぶ処理は意図的に入れていません)

})();
</script>
</body>
</html>
